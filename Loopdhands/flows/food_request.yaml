appId: com.loopedhands
name: Login and Submit Food Request
tags:
  - food-request
  - smoke
  - regression
---
- runFlow: login.yaml

- extendedWaitUntil:
    visible: "Welcome back.*"
    timeout: 20000

- tapOn:
    text: "Listings"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Request Food"
    timeout: 10000

- tapOn:
    text: "Request Food"
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Request Food"

- evalScript: ${output.requestTitle = "Maestro food request test " + Date.now()}
- tapOn: "What you looking for ?"
- inputText: ${output.requestTitle}
- tapOn: "Tell us more about your food listing"
- inputText: "Automated test."
- hideKeyboard

- tapOn:
    text: "Select Serving Size"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "2 Servings"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Select suburb location"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "^.+ - .+ - [0-9]{4}$"
    index: 0
    waitToSettleTimeoutMs: 500
- assertVisible: "^.+ - .+ - [0-9]{4}$"
- tapOn:
    text: "Home-Cooked"
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      text: "In 2-3 Days"
    direction: DOWN
- tapOn:
    text: "In 2-3 Days"
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      text: "Vegetarian"
    direction: DOWN
- tapOn:
    text: "Vegetarian"
    waitToSettleTimeoutMs: 500
- assertVisible: "In 2-3 Days"
- assertVisible: "Vegetarian"

- tapOn:
    text: "Post Request"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Post Now"
    timeout: 5000
- tapOn:
    text: "Post Now"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Post created successfully!"
    timeout: 15000
