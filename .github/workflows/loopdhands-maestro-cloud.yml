name: Loopdhands Maestro Cloud

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag containing loopdhands-2.6-staging.apk
        required: true
        type: string

permissions:
  contents: read

jobs:
  maestro-cloud:
    name: Run Loopdhands on Maestro Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Check out flows
        uses: actions/checkout@v4

      - name: Download APK from private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "loopdhands-2.6-staging.apk" \
            --dir "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/loopdhands-2.6-staging.apk"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | MAESTRO_VERSION=2.12.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run flows on Maestro Cloud
        id: cloud-run
        continue-on-error: true
        env:
          MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}
          MAESTRO_PROJECT_ID: ${{ secrets.MAESTRO_PROJECT_ID }}
          MAILSLURP_API_KEY: ${{ secrets.LOOPDHANDS_MAILSLURP_API_KEY }}
          EMAIL: ${{ secrets.LOOPDHANDS_EMAIL }}
          PASSWORD: ${{ secrets.LOOPDHANDS_PASSWORD }}
          MAILSLURP_INBOX_ID: ${{ secrets.LOOPDHANDS_MAILSLURP_INBOX_ID }}
          APP_FILE: ${{ runner.temp }}/loopdhands-2.6-staging.apk
          CLOUD_LOG: ${{ runner.temp }}/maestro-cloud.log
        run: |
          for name in MAESTRO_API_KEY MAESTRO_PROJECT_ID MAILSLURP_API_KEY EMAIL PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              printf 'Missing required GitHub Actions secret for %s\n' "$name" >&2
              exit 1
            fi
          done

          maestro cloud \
            --api-key "$MAESTRO_API_KEY" \
            --project-id "$MAESTRO_PROJECT_ID" \
            --app-file "$APP_FILE" \
            --flows Loopdhands/flows \
            --exclude-tags login \
            --name "Loopdhands-${GITHUB_RUN_NUMBER}" \
            -e EMAIL="$EMAIL" \
            -e PASSWORD="$PASSWORD" \
            -e MAILSLURP_API_KEY="$MAILSLURP_API_KEY" \
            -e MAILSLURP_INBOX_ID="${MAILSLURP_INBOX_ID:-}" \
            2>&1 | tee "$CLOUD_LOG"
          cloud_status="${PIPESTATUS[0]}"
          echo "status=$cloud_status" >> "$GITHUB_OUTPUT"
          exit "$cloud_status"

      - name: Send run report to Microsoft Teams
        if: always()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          CLOUD_OUTCOME: ${{ steps.cloud-run.outcome }}
          CLOUD_LOG: ${{ runner.temp }}/maestro-cloud.log
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          if [[ -z "$TEAMS_WEBHOOK_URL" ]]; then
            echo "Missing GitHub Actions secret: TEAMS_WEBHOOK_URL" >&2
            exit 1
          fi

          python3 - <<'PY' > "$RUNNER_TEMP/teams-payload.json"
          import json
          import os
          import re

          outcome = os.environ.get("CLOUD_OUTCOME", "skipped")
          flow_results = []
          console_url = ""
          try:
              with open(os.environ["CLOUD_LOG"], encoding="utf-8", errors="replace") as log:
                  cloud_log = log.read()
                  flow_results = re.findall(
                      r"^\[(?:Passed|Failed)\]\s+.+\s+\([^)]+\)(?:\s+\(.*\))?$",
                      cloud_log,
                      flags=re.MULTILINE,
                  )
                  match = re.search(r"https://app\.maestro\.dev/\S+", cloud_log)
                  if match:
                      console_url = match.group(0).rstrip(".,)")
          except FileNotFoundError:
              pass

          if flow_results:
              passed = sum(line.startswith("[Passed] ") for line in flow_results)
              failed = sum(line.startswith("[Failed] ") for line in flow_results)
          else:
              passed = int(outcome == "success")
              failed = 1 - passed

          status = "PASS" if outcome == "success" and failed == 0 else "FAIL"
          lines = [f"{status} | Loopdhands"]
          lines.extend(flow_results)
          lines.extend(["", f"Summary: {passed} passed, {failed} failed"])
          lines.append(f"GitHub Actions: {os.environ['RUN_URL']}")
          if console_url:
              lines.append(f"Maestro Cloud: {console_url}")

          card = {
              "$schema": "https://adaptivecards.io/schemas/adaptive-card.json",
              "type": "AdaptiveCard",
              "version": "1.2",
              "body": [{"type": "TextBlock", "text": "\n".join(lines), "wrap": True}],
          }
          print(json.dumps(card))
          PY

          curl --silent --show-error --fail-with-body --max-time 20 \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/teams-payload.json" \
            "$TEAMS_WEBHOOK_URL"

      - name: Fail workflow if Maestro Cloud failed
        if: steps.cloud-run.outcome != 'success'
        run: exit 1
