url: https://stillaware.itmanage.com.au/work-with-us
name: Submit Still Aware Volunteer Test Application
tags:
  - forms
  - submission
  - smoke
---
- launchApp
- extendedWaitUntil:
    visible: "Work With Us"
    timeout: 20000
- repeat:
    times: 12
    while:
      notVisible: "Register as Volunteer"
    commands:
      - scroll
- assertVisible: "Register as Volunteer"
- tapOn: "Register as Volunteer"
- extendedWaitUntil:
    visible: "Enter First Name"
    timeout: 60000
- assertVisible: "Enter First Name"

- tapOn: "Enter First Name"
- inputText: "Maestro QA"
- tapOn: "Enter Last Name"
- inputText: "Volunteer Test"
- tapOn: "Enter Email Address"
- evalScript: ${output.testEmail = "maestro.qa.volunteer." + Date.now() + "@example.com"}
- inputText: ${output.testEmail}
- tapOn: "Choose area of interest"
- tapOn: "Writing"
- assertVisible: "Writing"
- tapOn: "Enter Tell us about yourself and why you want to join us"
- inputText: "AUTOMATED QA TEST ONLY. Fictional test; please disregard and delete."
- swipe:
    start: 50%, 75%
    end: 50%, 35%
    duration: 500
- assertVisible: "Submit"
- tapOn: "Submit"
- extendedWaitUntil:
    notVisible: "Enter First Name"
    timeout: 10000
